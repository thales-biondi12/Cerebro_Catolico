<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo Cérebro Católico</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-slate-700 pb-4">
            <h1 class="text-3xl font-bold text-amber-500">✝️ Segundo Cérebro Católico</h1>
            <a href="/pregacao" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg font-medium transition">
                Gerar Pregação IA
            </a>
        </div>

        <!-- Formulário de Cadastro -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
            <h2 class="text-xl font-semibold mb-4 text-amber-400">Novo Estudo Teológico</h2>
            <form action="/api/estudos" method="POST" enctype="multipart/form-data" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Título</label>
                        <input type="text" name="titulo" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Categoria</label>
                        <select name="categoria" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
                            <option value="Conceitos">Conceitos</option>
                            <option value="Teologia">Teologia</option>
                            <option value="Sagradas Escrituras">Sagradas Escrituras</option>
                            <option value="Espiritualidade">Espiritualidade</option>
                            <option value="Catequese">Catequese</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm text-slate-400 mb-1">Resumo / O que é?</label>
                    <textarea name="resumo" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm text-slate-400 mb-1">Conteúdo Completo</label>
                    <textarea name="conteudo" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Tags (separadas por vírgula)</label>
                        <input type="text" name="tags" placeholder="e.g. graca, sacramentos, eucaristia" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Referencias (separadas por vírgula)</label>
                        <input type="text" name="referencias" placeholder="e.g. CIC 1210, Jo 3, 16" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm text-slate-400 mb-1">Anexos</label>
                    <input type="file" name="arquivos" multiple class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-300">
                </div>

                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-lg transition">
                    Salvar Nota de Estudo
                </button>
            </form>
        </div>

        <!-- Lista de Notas -->
        <div>
            <h2 class="text-2xl font-bold mb-4 text-slate-200">Seus Estudos</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {% for nota in notas %}
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-full border border-amber-500/20 font-medium">
                                {{ nota.categoria }}
                            </span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-100">{{ nota.titulo }}</h3>
                        <p class="text-slate-400 text-sm mt-1 line-clamp-3">{{ nota.resumo }}</p>
                    </div>

                    <div class="pt-3 border-t border-slate-700/50 flex justify-end">
                        <button onclick="abrirModalEdicao('{{ nota._id|string }}')" class="bg-slate-700 hover:bg-slate-600 text-amber-400 px-3 py-1.5 rounded-lg text-sm transition">
                            ✏️ Editar
                        </button>
                    </div>
                </div>
                {% else %}
                <p class="text-slate-500 col-span-full">Nenhum estudo cadastrado ainda.</p>
                {% endfor %}
            </div>
        </div>

    </div>

    <!-- Modal de Edição -->
    <div id="modal-edicao" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 rounded-xl p-6 max-w-2xl w-full border border-slate-700 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-xl font-bold text-amber-500">Editar Estudo</h3>
                <button onclick="fecharModalEdicao()" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>

            <form id="form-editar" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Título</label>
                    <input type="text" id="edit-titulo" name="titulo" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Categoria</label>
                    <select id="edit-categoria" name="categoria" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                        <option value="Conceitos">Conceitos</option>
                        <option value="Teologia">Teologia</option>
                        <option value="Sagradas Escrituras">Sagradas Escrituras</option>
                        <option value="Espiritualidade">Espiritualidade</option>
                        <option value="Catequese">Catequese</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Resumo</label>
                    <textarea id="edit-resumo" name="resumo" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white"></textarea>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Conteúdo</label>
                    <textarea id="edit-conteudo" name="conteudo" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Tags</label>
                        <input type="text" id="edit-tags" name="tags" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Referências</label>
                        <input type="text" id="edit-referencias" name="referencias" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-3">
                    <button type="button" onclick="fecharModalEdicao()" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-lg">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-lg">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function abrirModalEdicao(estudoId) {
            if (!estudoId || estudoId === 'undefined') {
                console.error("ID inválido para edição.");
                return;
            }

            try {
                const response = await fetch(`/api/estudos/${estudoId}`);
                if (!response.ok) {
                    throw new Error(`Erro na API: ${response.status}`);
                }

                const dados = await response.json();

                document.getElementById("edit-titulo").value = dados.titulo || '';
                document.getElementById("edit-categoria").value = dados.categoria || 'Conceitos';
                document.getElementById("edit-resumo").value = dados.resumo || '';
                document.getElementById("edit-conteudo").value = dados.conteudo || '';
                document.getElementById("edit-tags").value = dados.tags || '';
                document.getElementById("edit-referencias").value = dados.referencias || '';

                document.getElementById("form-editar").action = `/api/estudos/${estudoId}/editar`;

                const modal = document.getElementById("modal-edicao");
                modal.classList.remove("hidden");
                modal.classList.add("flex");
            } catch (err) {
                console.error("Erro ao carregar estudo para edição:", err);
            }
        }

        function fecharModalEdicao() {
            const modal = document.getElementById("modal-edicao");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }
    </script>
</body>
</html>
